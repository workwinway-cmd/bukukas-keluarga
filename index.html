<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas Keluarga — Edisi Lokal HP</title>
<meta name="theme-color" content="#2C5F6F">
<meta name="description" content="Aplikasi pencatatan kas keluarga, offline-first dengan opsi sinkron ke cloud sendiri.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buku Kas">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    /* Tema "Swiss Ledger" — minimalis, dingin, presisi ala laporan bank privat Nordik */
    --paper:#FAFAF9;
    --paper-line:#E5E7EB;
    --ink:#14171F;
    --ink-soft:#6B7280;
    --red:#B4483D;
    --red-soft:#D9938A;
    --sage:#3D7A5C;
    --sage-soft:#8FB6A2;
    --gold:#A6824B;
    --accent:#2C5F6F;
    --card:#FFFFFF;
    --surface-soft:#F3F4F6;
    --shadow: 0 1px 3px rgba(20,23,31,0.05);
    --radius:12px;
    --radius-sm:8px;
    --radius-lg:16px;
    --fs-xs:11px;
    --fs-sm:12px;
    --fs-base:14px;
    --fs-md:16px;
    --fs-lg:18px;
    --fs-xl:20px;
    --fs-2xl:24px;
    --fw-400:400;
    --fw-500:500;
    --fw-600:600;
    --fw-700:700;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-x:hidden;}
  body{
    background:var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    width:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 96px;width:100%;}
  .screen{padding:18px 16px 24px;}

  /* ---------- Header Beranda (logo + judul + bel notifikasi) ---------- */
  header.home-top{
    display:flex; align-items:center; gap:12px;
    padding:18px 16px 14px; background:var(--paper);
    border-bottom:1px solid var(--paper-line);
  }
  header.home-top .logo-box{
    flex-shrink:0; width:44px; height:44px; border-radius:var(--radius-sm);
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  header.home-top .titleblock{flex:1; min-width:0;}
  header.home-top h1{font-size:var(--fs-lg); font-weight:var(--fw-700); margin:0 0 2px; letter-spacing:-0.01em;}
  header.home-top p{margin:0; font-size:var(--fs-xs); color:var(--ink-soft); font-weight:var(--fw-500);}
  header.home-top .bell{
    flex-shrink:0; width:36px; height:36px; border-radius:50%; background:var(--surface-soft);
    display:flex; align-items:center; justify-content:center; color:var(--ink); border:1px solid var(--paper-line);
  }

  /* ---------- Header halaman lain (back-chevron + judul + aksi opsional) ---------- */
  header.page-top{
    display:flex; align-items:center; gap:10px;
    padding:16px 16px 14px; background:var(--paper);
    border-bottom:1px solid var(--paper-line);
  }
  header.page-top .back-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid var(--paper-line);
    background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer;
  }
  header.page-top h1{flex:1; min-width:0; font-size:var(--fs-lg); font-weight:var(--fw-700); margin:0; letter-spacing:-0.01em;}
  header.page-top .action-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid var(--paper-line);
    background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer;
  }

  /* ---------- Saldo Kas: kartu besar di Beranda ---------- */
  .saldo-hero{
    background:var(--accent); color:#fff; border-radius:var(--radius-lg);
    padding:18px 18px 20px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .saldo-hero .lbl{font-size:var(--fs-xs); letter-spacing:0.08em; text-transform:uppercase; font-family:'IBM Plex Mono', monospace; color:rgba(255,255,255,0.65); display:flex; align-items:center; justify-content:space-between;}
  .saldo-hero .eye-btn{background:transparent; border:none; color:rgba(255,255,255,0.85); cursor:pointer; padding:2px;}
  .saldo-hero .amt{font-size:28px; font-weight:var(--fw-700); margin-top:6px; letter-spacing:-0.01em;}
  .saldo-hero .sub{font-size:var(--fs-sm); color:rgba(255,255,255,0.7); margin-top:2px;}

  .mini-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:16px;}
  .mini-stat{background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); padding:12px 10px; text-align:center; box-shadow:var(--shadow);}
  .mini-stat .ico{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 6px;}
  .mini-stat.masuk .ico{background:rgba(61,122,92,0.14); color:var(--sage);}
  .mini-stat.keluar .ico{background:rgba(180,72,61,0.14); color:var(--red);}
  .mini-stat.selisih .ico{background:rgba(166,130,75,0.16); color:var(--gold);}
  .mini-stat .k{font-size:var(--fs-xs); color:var(--ink-soft); margin-bottom:3px;}
  .mini-stat .v{font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:var(--fw-600); overflow-wrap:break-word;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:4px 0 10px;}
  .section-head h3{font-size:var(--fs-md); font-weight:var(--fw-700); margin:0;}
  .section-head a{font-size:var(--fs-sm); color:var(--accent); text-decoration:none; font-weight:var(--fw-600); cursor:pointer;}

  /* ---------- List item transaksi (Beranda & Riwayat) ---------- */
  .tx-list{background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:16px;}
  .tx-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--paper-line); cursor:default;}
  .tx-row:last-child{border-bottom:none;}
  .tx-row .tx-ico{flex-shrink:0; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .tx-row.masuk .tx-ico{background:rgba(61,122,92,0.14); color:var(--sage);}
  .tx-row.keluar .tx-ico{background:rgba(180,72,61,0.14); color:var(--red);}
  .tx-row .tx-mid{flex:1; min-width:0;}
  .tx-row .tx-name{font-size:var(--fs-base); font-weight:var(--fw-600); color:var(--ink);}
  .tx-row .tx-meta{font-size:var(--fs-xs); color:var(--ink-soft); margin-top:2px;}
  .tx-row .tx-amt{flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:var(--fs-sm); font-weight:var(--fw-600); white-space:nowrap;}
  .tx-row.masuk .tx-amt{color:var(--sage);}
  .tx-row.keluar .tx-amt{color:var(--red);}

  .tx-month-header{display:flex; align-items:baseline; justify-content:space-between; padding:10px 14px; background:var(--surface-soft); font-family:'IBM Plex Mono', monospace; font-size:var(--fs-xs); color:var(--ink-soft);}
  .tx-month-header .totals span{margin-left:8px;}
  .tx-date-badge{flex-shrink:0; width:38px; text-align:center;}
  .tx-date-badge .d{font-size:var(--fs-md); font-weight:var(--fw-700); line-height:1.1;}
  .tx-date-badge .m{font-size:9px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.04em;}

  /* ---------- Search bar & filter chips (Riwayat) ---------- */
  .search-bar{display:flex; align-items:center; gap:8px; background:var(--surface-soft); border:1px solid var(--paper-line); border-radius:var(--radius-sm); padding:9px 12px; margin-bottom:14px; color:var(--ink-soft);}
  .search-bar input{border:none; background:transparent; padding:0; flex:1; font-size:var(--fs-base); color:var(--ink);}
  .search-bar input:focus{outline:none;}
  .chip-row{display:flex; gap:8px; align-items:center; margin-bottom:16px; overflow-x:auto;}
  .chip{flex:0 0 auto; font-size:var(--fs-sm); font-weight:var(--fw-600); padding:7px 14px; border-radius:20px; background:var(--card); border:1px solid var(--paper-line); color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .chip-icon{flex-shrink:0; width:34px; height:34px; border-radius:var(--radius-sm); border:1px solid var(--paper-line); background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer; margin-left:auto;}

  /* ---------- Toggle Pemasukan/Pengeluaran (Catat Transaksi) ---------- */
  .seg-toggle{display:flex; background:var(--surface-soft); border-radius:var(--radius-sm); padding:4px; margin-bottom:16px;}
  .seg-toggle button{flex:1; border:none; background:transparent; padding:9px; border-radius:6px; font-size:var(--fs-base); font-weight:var(--fw-600); color:var(--ink-soft); cursor:pointer;}
  .seg-toggle button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .seg-toggle button.active.masuk{color:var(--sage);}
  .seg-toggle button.active.keluar{color:var(--red);}

  .field-icon-input{position:relative;}
  .field-icon-input input, .field-icon-input select{padding-left:34px;}
  .field-icon-input .fi{position:absolute; left:10px; top:34px; color:var(--ink-soft); pointer-events:none;}

  /* ---------- Donut anggaran ---------- */
  .donut-wrap{display:flex; align-items:center; gap:18px; margin-bottom:6px; flex-wrap:wrap;}
  .donut{width:110px; height:110px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative;}
  .donut .donut-hole{width:72px; height:72px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut .donut-hole .pct{font-size:var(--fs-xl); font-weight:var(--fw-700);}
  .donut .donut-hole .pct-lbl{font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}
  .donut-legend{flex:1; min-width:150px;}
  .donut-legend .dl-row{display:flex; justify-content:space-between; font-size:var(--fs-sm); padding:4px 0;}
  .donut-legend .dl-row .lbl{color:var(--ink-soft);}
  .donut-legend .dl-row .val{font-family:'IBM Plex Mono', monospace; font-weight:var(--fw-600);}

  .budget-item{padding:11px 0; border-bottom:1px solid var(--paper-line);}
  .budget-item:last-child{border-bottom:none;}
  .budget-item .bi-top{display:flex; justify-content:space-between; font-size:var(--fs-base); margin-bottom:6px;}
  .budget-item .bi-top .nm{font-weight:var(--fw-600);}
  .budget-item .bi-top .pct{font-size:var(--fs-xs); color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .budget-item .bi-amt{font-size:var(--fs-xs); color:var(--ink-soft); margin-top:4px; font-family:'IBM Plex Mono', monospace;}
  .progress-track{height:7px; background:var(--surface-soft); border-radius:4px; overflow:hidden;}
  .progress-track > div{height:100%; border-radius:4px;}

  /* ---------- Daftar menu / pengaturan (Akun) ---------- */
  .settings-section-title{font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:var(--fw-600); margin:20px 0 8px 2px;}
  .settings-section-title:first-of-type{margin-top:0;}
  .settings-list{background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .settings-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--paper-line); cursor:pointer; background:none; width:100%; text-align:left; font-family:'Inter', sans-serif; color:var(--ink);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .si{flex-shrink:0; width:30px; height:30px; border-radius:var(--radius-sm); background:var(--surface-soft); display:flex; align-items:center; justify-content:center; color:var(--accent);}
  .settings-row .st{flex:1; min-width:0;}
  .settings-row .st .nm{font-size:var(--fs-base); font-weight:var(--fw-500);}
  .settings-row .st .vv{font-size:var(--fs-xs); color:var(--ink-soft); margin-top:1px;}
  .settings-row .chev{flex-shrink:0; color:var(--ink-soft);}

  /* ---------- Bottom navigation ---------- */
  nav.bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:200;
    background:var(--card); border-top:1px solid var(--paper-line);
    display:flex; align-items:center; justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  nav.bottom-nav .nb-item{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-family:'Inter', sans-serif; font-size:10px; font-weight:var(--fw-600);
    cursor:pointer; padding:4px 8px; flex:1;
  }
  nav.bottom-nav .nb-item.active{color:var(--accent);}
  nav.bottom-nav .nb-add{
    flex-shrink:0; width:50px; height:50px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    margin-top:-26px; box-shadow:0 3px 10px rgba(44,95,111,0.35);
  }

  /* ---------- Tabs pill (Laporan: Ringkasan/Arus Kas/Kategori) ---------- */
  .pill-tabs{display:flex; background:var(--surface-soft); border-radius:var(--radius-sm); padding:4px; margin-bottom:16px;}
  .pill-tabs button{flex:1; border:none; background:transparent; padding:8px; border-radius:6px; font-size:var(--fs-sm); font-weight:var(--fw-600); color:var(--ink-soft); cursor:pointer;}
  .pill-tabs button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:24px;
    border-bottom:1px solid var(--paper-line);
    padding-bottom:16px;
  }
  .titleblock h1{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 2px;
    letter-spacing:-0.02em;
  }
  .titleblock p{
    margin:0;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
    font-family:'Inter', sans-serif;
  }
  .stamp{
    flex-shrink:0;
    min-width:112px;
    border-radius:12px;
    padding:12px 16px;
    background:var(--accent);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
    text-align:right;
  }
  .stamp.positive .amt{color:#fff;}
  .stamp .lbl{
    font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    font-family:'IBM Plex Mono', monospace; color:rgba(255,255,255,0.6);
  }
  .stamp .amt{
    font-size:19px; font-weight:600; font-family:'Inter', sans-serif;
    color:#fff; line-height:1.1; white-space:nowrap;
  }
  .stamp .amt-full{
    font-size:9.5px; font-family:'IBM Plex Mono', monospace;
    color:rgba(255,255,255,0.5); white-space:nowrap;
  }

  nav.tabs{display:none;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-family:'Inter', sans-serif;
    font-size:16px;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .card .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}

  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:4px;
    margin-top:12px;
  }
  input, select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    background:var(--surface-soft);
    color:var(--ink);
  }
  input:focus, select:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  input[type=number], .mono{font-family:'IBM Plex Mono', monospace;}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .row2{grid-template-columns:1fr;} }

  .opening-row{padding:10px 0; border-bottom:1px solid var(--paper-line);}
  .opening-row:last-of-type{border-bottom:none;}
  .opening-row-label{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--gold); font-weight:600; margin-top:4px;}

  .label-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; margin-bottom:4px;}
  .label-row label{margin:0;}
  .info-pop{position:relative; flex-shrink:0;}
  .info-pop summary{
    list-style:none; cursor:pointer; width:16px; height:16px; border-radius:50%;
    background:var(--surface-soft); border:1px solid var(--paper-line); color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  .info-pop summary::-webkit-details-marker{display:none;}
  .info-pop[open] summary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .info-pop .info-text{
    position:absolute; right:0; top:22px; z-index:30; width:230px; max-width:64vw;
    background:var(--ink); color:#fff; font-size:11.5px; line-height:1.5; font-weight:400;
    text-transform:none; letter-spacing:normal;
    padding:10px 12px; border-radius:10px; box-shadow:var(--shadow);
  }

  .card-recurring{border-color:var(--gold); background:rgba(173,138,78,0.045);}
  .card-recurring h2{color:var(--gold);}
  .badge-template{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:9px; font-weight:700;
    letter-spacing:0.06em; color:var(--gold); border:1px solid var(--gold); border-radius:5px;
    padding:2px 6px; margin-left:6px; vertical-align:middle;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    margin-top:16px;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:#3a3a3d;}
  .btn-ghost{background:transparent; border:1px solid var(--ink-soft); color:var(--ink);}
  .btn-danger{background:transparent;color:var(--red); border:1px solid var(--red-soft); border-radius:6px; padding:5px 10px; font-size:12px; margin-top:0; white-space:nowrap;}

  .table-wrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; min-width:480px; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--paper-line);
    padding:6px 8px;
    font-weight:600;
    white-space:nowrap;
  }
  tbody td{
    padding:9px 8px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:top;
  }
  tbody tr:hover{background:var(--surface-soft);}
  td.amt, th.amt{text-align:right; font-family:'IBM Plex Mono', monospace;}
  .tag{
    display:inline-block;
    font-size:10px;
    padding:2px 7px;
    border-radius:10px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .tag.aset{background:rgba(76,122,94,0.15); color:var(--sage);}
  .tag.pendapatan{background:rgba(76,122,94,0.15); color:var(--sage);}
  .tag.beban{background:rgba(166,61,64,0.13); color:var(--red);}

  .empty{
    text-align:center;
    padding:26px 10px;
    color:var(--ink-soft);
    font-style:italic;
    font-family:'Inter', sans-serif;
    font-size:14px;
  }

  .summary-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px;}
  @media (max-width:520px){ .summary-grid{grid-template-columns:1fr 1fr;} }

  .insight-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--paper-line);}
  .insight-row:last-child{border-bottom:none;}
  .insight-icon{font-size:16px; flex-shrink:0; line-height:1.4;}
  .insight-text{font-size:13px; color:var(--ink); line-height:1.5;}
  .stat{
    background:var(--surface-soft);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:12px 12px;
    min-width:0;
  }

<div class="wrap" id="app">
  <div class="loading">Membuka buku kas…</div>
</div>

<script>
const STORAGE_KEY_COA = 'coa';
const STORAGE_KEY_JOURNAL = 'journal';
const STORAGE_KEY_OPENING = 'opening-balance';
const STORAGE_KEY_BUDGETS = 'budgets';
const STORAGE_KEY_RECURRING = 'recurring';
const STORAGE_KEY_GOALS = 'savings-goals';
const STORAGE_KEY_SYNC = 'sync-settings';

// ---------- ADAPTER PENYIMPANAN LOKAL (localStorage) ----------
// Versi ini TIDAK memakai window.storage milik Claude — semua data tersimpan
// langsung di browser HP ini lewat localStorage, supaya file HTML-nya bisa
// dipakai berdiri sendiri (diunduh & dibuka langsung dari browser HP),
// tanpa bergantung pada akun/paket Claude apapun.
const LOCAL_PREFIX = 'bukukas:';
const storage = {
  async get(key){
    try{
      const raw = localStorage.getItem(LOCAL_PREFIX + key);
      if(raw === null) return null;
      return { key, value: raw };
    }catch(e){ throw e; }
  },
  async set(key, value){
    // Parameter ketiga (shared) dari kode lama tetap boleh dikirim, cukup diabaikan di sini.
    localStorage.setItem(LOCAL_PREFIX + key, value);
    return { key, value };
  },
  async delete(key){
    localStorage.removeItem(LOCAL_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix){
    const keys = Object.keys(localStorage)
      .filter(k => k.startsWith(LOCAL_PREFIX + (prefix || '')))
      .map(k => k.slice(LOCAL_PREFIX.length));
    return { keys };
  }
};

// Perkiraan kapasitas localStorage yang terpakai oleh aplikasi ini (dalam KB).
// Browser biasanya menyediakan sekitar 5–10MB per situs untuk localStorage.
function localStorageUsageKB(){
  try{
    let total = 0;
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith(LOCAL_PREFIX)) total += (localStorage.getItem(k) || '').length + k.length;
    });
    return Math.round(total / 1024);
  }catch(e){ return 0; }
}

// Menyimpan data ke localStorage dengan penanganan galat yang jelas ke pengguna
// (mis. saat kuota penuh) — dipakai oleh semua fungsi saveXxx() di bawah.
async function persistLocal(key, value, label){
  try{
    await storage.set(key, value, false);
    return true;
  }catch(e){
    console.error(`Gagal menyimpan ${label}`, e);
    alert(`Gagal menyimpan ${label} — penyimpanan lokal HP kemungkinan penuh. Coba ekspor data ke Excel sebagai backup, lalu hapus beberapa foto struk atau transaksi lama untuk melonggarkan ruang.`);
    return false;
  }
}

// Menandai kapan terakhir kali pengguna melakukan backup (ekspor Excel),
// dipakai untuk pengingat backup rutin di Dasbor karena data hanya ada di HP ini.
async function markBackupDone(){
  await persistLocal('last-backup', new Date().toISOString(), 'catatan waktu backup');
}
function daysSinceBackup(){
  try{
    const raw = localStorage.getItem(LOCAL_PREFIX + 'last-backup');
    if(!raw) return null;
    return Math.floor((Date.now() - new Date(raw).getTime()) / 86400000);
  }catch(e){ return null; }
}

// ---------- SINKRONISASI CLOUD (Cloudflare Worker) — OTOMATIS SEPENUHNYA ----------
// Semua data TETAP tersimpan di localStorage HP sebagai sumber utama (app tetap
// bisa dipakai offline tanpa setelan apapun). Kalau pengguna mengisi Pengaturan
// Sinkronisasi di tab "Cloud", app akan mendorong (push) & menarik (pull) snapshot
// data ke/dari Cloudflare Worker + KV milik pengguna sendiri secara otomatis di
// latar belakang, supaya semua perangkat yang memakai namespace yang sama selalu
// sinkron tanpa perlu tombol manual apa pun.
// Kredensial (token) HANYA disimpan di localStorage HP ini, tidak pernah dikirim ke
// pihak lain selain endpoint Cloudflare Worker yang pengguna sendiri masukkan.
const SYNC_DEFAULTS = {
  cfUrl: 'https://kasrumah.workwinway.workers.dev', cfToken: '', cfNamespace: 'default',
  lastPush: null, lastPull: null, lastSyncError: null,
  cloudVersion: null,   // nomor versi cloud terakhir yang kita tahu (utk deteksi konflik)
  dirty: false,         // true = ada perubahan lokal yang belum berhasil dikirim ke cloud
  autoSyncOn: true,     // sinkron otomatis (push & pull berkala) aktif/nonaktif
};
// CATATAN: state.sync diisi nanti di dalam deklarasi `let state = {...}` di bawah
// (bukan di sini) — karena variabel `state` sendiri baru dideklarasikan lebih ke
// bawah; mengaksesnya di sini akan menyebabkan ReferenceError "Cannot access
// 'state' before initialization" dan app gagal total (macet di layar loading).

async function loadSyncSettings(){
  try{
    const res = await storage.get(STORAGE_KEY_SYNC, false);
    state.sync = Object.assign({}, SYNC_DEFAULTS, res ? JSON.parse(res.value) : {});
  }catch(e){ state.sync = Object.assign({}, SYNC_DEFAULTS); }
  // Kalau belum pernah diisi manual (masih kosong dari penyimpanan lama),
  // pakai URL Worker default supaya sinkron langsung aktif tanpa perlu ketik ulang.
  if(!state.sync.cfUrl) state.sync.cfUrl = SYNC_DEFAULTS.cfUrl;
}
async function saveSyncSettings(){
  await persistLocal(STORAGE_KEY_SYNC, JSON.stringify(state.sync), 'pengaturan sinkronisasi');
}

// Snapshot seluruh data aplikasi jadi satu objek — dipakai untuk push ke Cloudflare
// supaya semua perangkat selalu konsisten.
function buildSnapshot(){
  return {
    coa: state.coa,
    journal: state.journal,
    openingBalances: state.openingBalances,
    budgets: state.budgets,
    recurring: state.recurring,
    savingsGoals: state.savingsGoals,
    updatedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
  };
}
function applySnapshot(snap){
  if(!snap || typeof snap !== 'object') return false;
  state.coa = snap.coa || DEFAULT_COA.slice();
  state.journal = snap.journal || [];
  state.openingBalances = snap.openingBalances || {};
  state.budgets = snap.budgets || {};
  state.recurring = snap.recurring || [];
  state.savingsGoals = snap.savingsGoals || [];
  return true;
}

// ---------- AUTO-SYNC ANTAR PERANGKAT ----------
// Pola: setiap simpanan lokal dianggap "kotor" (dirty) sampai berhasil ter-push,
// dan setiap push WAJIB menyertakan "versi" cloud terakhir yang kita tahu.
// Kalau versi itu sudah tidak cocok (ada HP lain yg menulis duluan), server
// menolak dgn 409 -> kita tarik data terbaru dulu (smart pull), baru user bisa
// coba simpan ulang. Selain push otomatis tiap ada perubahan, app juga menarik
// (pull) secara berkala + saat app dibuka/kembali aktif, supaya perubahan dari
// HP lain otomatis nongol tanpa perlu pencet tombol apa pun.
let _cloudSyncTimer = null;
let _cloudPolling = false;
const CLOUD_POLL_MS = 20000; // cek pembaruan dari perangkat lain tiap 20 detik saat app terbuka

function cloudReady(){ return !!(state.sync && state.sync.cfUrl); }

// Dipanggil setiap kali ada perubahan tersimpan (saveJournal, saveCOA, dst).
// Ditandai dirty SEGERA (biar status "belum tersinkron" akurat walau tab
// ditutup sebelum debounce selesai), lalu push di-debounce 1.5 detik supaya
// beberapa perubahan beruntun cuma memicu 1x kirim ke cloud.
function queueCloudSync(){
  if(!cloudReady()) return; // belum diaktifkan, tidak ada efek apapun
  state.sync.dirty = true;
  updateCloudStatusUI && updateCloudStatusUI();
  clearTimeout(_cloudSyncTimer);
  _cloudSyncTimer = setTimeout(()=>{
    cloudPush().catch(e=>{
      console.warn('Cloud sync gagal', e);
      state.sync.lastSyncError = e.message || 'Gagal tidak diketahui';
      saveSyncSettings();
      showToast('Gagal sinkron ke cloud: ' + (e.message || 'Periksa tab Cloud'), 'error');
      updateCloudStatusUI && updateCloudStatusUI();
    });
  }, 1500);
}

function cfEndpoint(){
  const base = (state.sync.cfUrl || '').replace(/\/+$/,'');
  const ns = encodeURIComponent(state.sync.cfNamespace || 'default');
  return `${base}/api/state?ns=${ns}`;
}

function cfHeaders(extra){
  return {
    ...(state.sync.cfToken ? {'Authorization': `Bearer ${state.sync.cfToken}`} : {}),
    ...(extra || {}),
  };
}

// Mendorong data lokal saat ini ke Cloudflare Worker (sumber sinkron lintas perangkat).
// Menyertakan "version" cloud terakhir yg kita tahu -> kalau server sudah punya
// versi lebih baru (ditulis HP lain), server balas 409 dan kita TIDAK menimpanya;
// alih-alih kita tarik dulu data terbaru itu (data lokal yg belum sempat terkirim
// tetap aman di localStorage HP ini sampai user coba simpan lagi).
async function cloudPush(isRetry){
  if(!state.sync.cfUrl) throw new Error('URL Cloudflare Worker belum diisi');
  // PENTING: kalau HP ini belum pernah sinkron sama sekali, cloudVersion masih
  // null. Kita anggap itu SAMA DENGAN "versi 0" (bukan skip field version).
  // Kenapa: kalau field version tidak dikirim sama sekali, server menganggap
  // klien "tidak peduli versi apa pun di cloud" dan langsung menimpa TANPA
  // cek konflik — ini BUG BERBAHAYA: HP baru yang localnya masih kosong bisa
  // menimpa data asli di cloud yang sudah ditulis HP lain sebelumnya.
  // Dengan mengirim version:0 secara eksplisit, kalau cloud memang masih
  // kosong (versi server juga 0) push tetap sukses seperti biasa. Tapi kalau
  // cloud SUDAH punya data (versi server > 0), server akan balas 409 —
  // dan alur retry di bawah ini otomatis menarik data asli itu dulu sebelum
  // mencoba push ulang, sehingga data yang sudah ada tidak pernah tertimpa
  // diam-diam oleh HP yang baru pertama kali sinkron.
  const versionField = { version: (state.sync.cloudVersion !== null && state.sync.cloudVersion !== undefined) ? state.sync.cloudVersion : 0 };
  const res = await fetch(cfEndpoint(), {
    method: 'PUT',
    headers: cfHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({ data: buildSnapshot(), ...versionField }),
  });
  if(res.status === 409){
    if(isRetry){
      // Sudah dicoba ulang sekali dan masih bentrok terus — kemungkinan ada
      // device lain yg juga sedang aktif menulis berkali-kali. Jangan looping
      // tanpa henti; laporkan sebagai gagal supaya user tahu & bisa coba lagi.
      throw new Error('Data di cloud terus berubah dari perangkat lain — coba sinkron lagi sebentar.');
    }
    // Full otomatis: jangan lempar error ke user. Samakan dulu versi lokal
    // dengan versi cloud yang sebenarnya (lewat pull), lalu KIRIM
    // ULANG push ini sekali — supaya perubahan yg tadi mau disimpan benar-benar
    // sampai ke server, bukan cuma "dianggap berhasil" tanpa isi.
    console.warn('Konflik sinkron — menyamakan versi & mencoba kirim ulang...');
    await cloudPull({ silent: true, reasonConflict: true });
    updateCloudStatusUI && updateCloudStatusUI();
    return await cloudPush(true);
  }
  if(!res.ok) throw new Error(`Worker menolak (HTTP ${res.status})`);
  const result = await res.json();
  state.sync.lastPush = new Date().toISOString();
  state.sync.lastSyncError = null;
  state.sync.cloudVersion = result.version;
  state.sync.dirty = false;
  await saveSyncSettings();
  updateCloudStatusUI && updateCloudStatusUI();
  if(isRetry) showToast('Sempat bentrok, tapi berhasil disamakan & tersimpan', 'info');
  return true;
}

// Menarik data dari Cloudflare Worker dan MENIMPA data lokal HP ini.
// Dipakai saat: pindah/tambah perangkat baru, dipanggil manual lewat tombol
// "Tarik dari Cloud", TERMASUK otomatis saat app dibuka/berkala/kena konflik.
// opts.silent: jangan lempar error ke pemanggil kalau cuma dipakai polling latar
// belakang (mis. belum ada koneksi internet sesaat).
async function cloudPull(opts){
  opts = opts || {};
  if(!state.sync.cfUrl){
    if(opts.silent) return false;
    throw new Error('URL Cloudflare Worker belum diisi');
  }
  const res = await fetch(cfEndpoint(), { method: 'GET', headers: cfHeaders() });
  if(res.status === 404){
    if(opts.silent) return false;
    throw new Error('Belum ada data tersimpan di cloud untuk namespace ini');
  }
  if(!res.ok){
    if(opts.silent) return false;
    throw new Error(`Worker menolak (HTTP ${res.status})`);
  }
  const payload = await res.json();

  // Kalau versi cloud SAMA dengan yang sudah kita punya, tidak ada yg baru —
  // tidak perlu timpa apa pun (mencegah kedipan UI & kehilangan draft yg lagi diketik).
  if(!opts.reasonConflict && payload.version !== undefined && payload.version === state.sync.cloudVersion){
    return false;
  }
  // Kalau ada perubahan LOKAL yg belum terkirim (dirty) dan ini cuma polling
  // latar belakang biasa (bukan hasil push kita sendiri yg kena 409), JANGAN
  // menimpanya diam-diam — biarkan push berikutnya yg menegosiasikan lewat
  // pengecekan versi di server, supaya perubahan HP ini tidak hilang.
  if(state.sync.dirty && opts.silent && !opts.reasonConflict){
    return false;
  }

  applySnapshot(payload.data !== undefined ? payload.data : payload); // fallback data lama tanpa "version"
  await Promise.all([saveCOA(), saveJournal(), saveOpening(), saveBudgets(), saveRecurring(), saveGoals()]);
  state.sync.lastPull = new Date().toISOString();
  state.sync.cloudVersion = payload.version !== undefined ? payload.version : state.sync.cloudVersion;
  state.sync.dirty = false;
  await saveSyncSettings();
  if(state.tab === 'dashboard' || state.tab === 'jurnal') render();
  updateCloudStatusUI && updateCloudStatusUI();
  return true;
}

// Sinkron berkala di latar belakang: tarik pembaruan dari perangkat lain tiap
// beberapa detik selama app terbuka & terlihat (tab aktif), plus langsung cek
// begitu app dibuka atau kembali ke foreground (mis. user balik dari app lain).
function startCloudAutoSync(){
  if(_cloudPolling) return;
  _cloudPolling = true;
  const tick = () => {
    if(!cloudReady() || state.sync.autoSyncOn === false) return;
    if(document.visibilityState !== 'visible') return;
    cloudPull({ silent: true }).catch(()=>{});
  };
  setInterval(tick, CLOUD_POLL_MS);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') tick(); });
  window.addEventListener('online', tick);
  tick(); // cek sekali segera saat app dibuka
}

const DEFAULT_COA = [
  {kode:'101', nama:'Kas', tipe:'Aset', normal:'Debit', locked:true},
  {kode:'102', nama:'Tabungan', tipe:'Aset', normal:'Debit'},
  {kode:'401', nama:'Pendapatan Gaji', tipe:'Pendapatan', normal:'Kredit'},
  {kode:'402', nama:'Pendapatan Lainnya', tipe:'Pendapatan', normal:'Kredit'},
  {kode:'501', nama:'Beban Makan & Minum', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},
  {kode:'502', nama:'Beban Listrik & Air', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},
  {kode:'503', nama:'Beban Transportasi', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},
  {kode:'504', nama:'Beban Komunikasi & Internet', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},
  {kode:'505', nama:'Beban Pendidikan', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},
  {kode:'506', nama:'Beban Kesehatan', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},
  {kode:'507', nama:'Beban Rumah Tangga', tipe:'Beban', normal:'Debit', grup:'Kebutuhan Pokok'},

  {kode:'901', nama:'Penyesuaian Saldo (Lebih)', tipe:'Pendapatan', normal:'Kredit', locked:true},
  {kode:'902', nama:'Penyesuaian Saldo (Kurang)', tipe:'Beban', normal:'Debit', locked:true},

let state = {
  coa: [],
  journal: [],
  openingBalances: {}, // { kode: {tanggal, jumlah} } — satu entri per akun Aset
  budgets: {}, // { kodeAkunBeban: batasBulanan }
  recurring: [], // [{id, label, debit, kredit, jumlah, keterangan}]
  savingsGoals: [], // [{id, nama, target, akunKode}]
  journalFilter: { q:'', akun:'', dari:'', sampai:'' }, // filter tampilan riwayat jurnal (tidak disimpan)
  tab: 'beranda',
  ready: false,
  viewMonth: new Date().getMonth(),
  viewYear: new Date().getFullYear(),
  sync: Object.assign({}, SYNC_DEFAULTS),
};

const rupiah = (n) => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', minimumFractionDigits:0, maximumFractionDigits:0}).format(n||0);

// Label field + tombol info "i" yang bisa di-tap untuk penjelasan singkat,
// supaya istilah seperti Debit/Kredit tidak bikin salah paham.
function fieldLabel(forId, text, tip){
  return `
    <div class="label-row">
      <label for="${forId}">${text}</label>
      <details class="info-pop"><summary aria-label="Info">i</summary><div class="info-text">${tip}</div></details>
    </div>
  `;
}

// Tekan Enter di sebuah field langsung pindah fokus ke field berikutnya (bukan submit form),
// supaya isi transaksi berurutan cepat tanpa perlu tap manual satu-satu.
// Field terakhir tetap men-submit form seperti biasa saat Enter ditekan.
function attachEnterToNextField(formEl){
  if(!formEl) return;
  formEl.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    const tag = e.target.tagName;
    if(tag !== 'INPUT' && tag !== 'SELECT') return;
    if(e.target.type === 'file') return; // biarkan perilaku bawaan pemilih file
    e.preventDefault();
    const fields = Array.from(formEl.querySelectorAll('input:not([type=file]), select'));
    const idx = fields.indexOf(e.target);
    if(idx === -1) return;
    const next = fields[idx + 1];
    if(next){
      next.focus();
      if(typeof next.select === 'function') { try{ next.select(); }catch(err){} }
    } else if(typeof formEl.requestSubmit === 'function'){
      formEl.requestSubmit();
    }
  });
}

// Format ringkas untuk saldo besar di kotak header: nol tiga terakhir dibuang,
// sisanya diberi titik ribuan lalu ditutup "K" (mis. 100000000 -> "Rp 100.000K").
// Di bawah 1000, tampilkan apa adanya supaya tidak jadi "Rp 0K" untuk nominal kecil.
function formatSaldoK(n){
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  if(abs < 1000) return rupiah(n);
  const ribuan = Math.round(abs / 1000);
  const formatted = ribuan.toLocaleString('id-ID');
  return (neg ? '-Rp ' : 'Rp ') + formatted + 'K';
}

// Format angka jadi "1.000" saat mengetik, dan baca kembali jadi angka murni.
function formatRibuan(val){
  const digits = String(val).replace(/[^\d]/g,'');
  if(!digits) return '';
  return Number(digits).toLocaleString('id-ID');
}
function parseRibuan(val){
  return Number(String(val).replace(/[^\d]/g,'')) || 0;
}
// Pasang perilaku: klik saat bernilai 0 langsung mengosongkan field agar mudah diketik,
// dan setiap ketikan otomatis diformat pakai titik ribuan.
function attachRibuanInput(inputEl){
  if(!inputEl) return;
  inputEl.addEventListener('focus', ()=>{
    if(parseRibuan(inputEl.value) === 0) inputEl.value = '';
  });
  inputEl.addEventListener('blur', ()=>{
    if(inputEl.value.trim() === '') inputEl.value = formatRibuan(0);
  });
  inputEl.addEventListener('input', ()=>{
    const raw = parseRibuan(inputEl.value);
    inputEl.value = raw ? formatRibuan(raw) : '';
  });
}

// Popup kecil (toast) untuk notifikasi ringan yang tidak memblokir (tidak seperti
// alert()/confirm() bawaan browser). kind: 'success' | 'info' | 'error'.
function showToast(msg, kind){
  const colors = { success: 'var(--sage)', info: 'var(--accent)', error: 'var(--red)' };
  let host = document.getElementById('toast-host');
  if(!host){
    host = document.createElement('div');
    host.id = 'toast-host';
    host.style.cssText = 'position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;';
    document.body.appendChild(host);
  }
  const toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = `background:${colors[kind] || colors.success}; color:#fff; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:10px 18px; border-radius:20px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:opacity .25s ease, transform .25s ease; max-width:88vw; text-align:center;`;
  host.appendChild(toast);
  requestAnimationFrame(()=>{ toast.style.opacity='1'; toast.style.transform='translateY(0)'; });
  setTimeout(()=>{
    toast.style.opacity='0'; toast.style.transform='translateY(8px)';
    setTimeout(()=> toast.remove(), 300);
  }, kind === 'error' ? 3600 : 2200);
}
function showSuccessToast(msg){ showToast(msg, 'success'); }

// Menjalankan render() tanpa kehilangan fokus/posisi kursor pada input yang sedang diketik
// (dipakai untuk filter pencarian jurnal yang re-render tiap ketikan).
function preserveFocus(fn){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  fn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// Kompres foto struk di sisi browser (max lebar 480px, kualitas JPEG 0.6)
// sebelum disimpan sebagai base64, supaya ukuran data jurnal tidak membengkak.
function compressImageToDataURL(file, maxWidth, quality){
  maxWidth = maxWidth || 360;
  quality = quality || 0.45;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        // WebP biasanya jauh lebih kecil dari JPEG di kualitas setara.
        // Coba WebP dulu; kalau browser tidak mendukung (mis. Safari lama), otomatis jatuh ke JPEG.
        let dataUrl;
        try{
          dataUrl = canvas.toDataURL('image/webp', quality);
          if(!dataUrl || dataUrl.indexOf('data:image/webp') !== 0){
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
        }catch(e){
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.onerror = ()=> reject(new Error('Gagal memuat gambar'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('Gagal membaca file'));
    reader.readAsDataURL(file);
  });
}

async function loadState(){
  try{
    const coaRes = await storage.get(STORAGE_KEY_COA, false);
    state.coa = coaRes ? JSON.parse(coaRes.value) : DEFAULT_COA.slice();
  }catch(e){ state.coa = DEFAULT_COA.slice(); }

  // Self-healing: pastikan akun sistem untuk rekonsiliasi selalu ada,
  // termasuk untuk pengguna lama yang datanya dibuat sebelum fitur ini ada.
  let coaPatched = false;
  if(!state.coa.some(a=>a.kode==='901')){
    state.coa.push({kode:'901', nama:'Penyesuaian Saldo (Lebih)', tipe:'Pendapatan', normal:'Kredit', locked:true});
    coaPatched = true;
  }
  if(!state.coa.some(a=>a.kode==='902')){
    state.coa.push({kode:'902', nama:'Penyesuaian Saldo (Kurang)', tipe:'Beban', normal:'Debit', locked:true});
    coaPatched = true;
  }
  if(coaPatched){ await saveCOA(); }

  try{
    const jRes = await storage.get(STORAGE_KEY_JOURNAL, false);
    state.journal = jRes ? JSON.parse(jRes.value) : [];
  }catch(e){ state.journal = []; }

  try{
    const oRes = await storage.get(STORAGE_KEY_OPENING, false);
    const parsed = oRes ? JSON.parse(oRes.value) : {};
    if(parsed && typeof parsed === 'object' && 'tanggal' in parsed){
      // format lama: satu saldo awal tunggal, dianggap milik akun Kas (101)
      state.openingBalances = parsed.tanggal ? {'101': {tanggal: parsed.tanggal, jumlah: Number(parsed.jumlah)||0}} : {};
    } else {
      state.openingBalances = parsed || {};
    }
  }catch(e){ state.openingBalances = {}; }

  try{
    const bRes = await storage.get(STORAGE_KEY_BUDGETS, false);
    state.budgets = bRes ? JSON.parse(bRes.value) : {};
  }catch(e){ state.budgets = {}; }

  try{
    const rRes = await storage.get(STORAGE_KEY_RECURRING, false);
    state.recurring = rRes ? JSON.parse(rRes.value) : [];
  }catch(e){ state.recurring = []; }

  try{
    const gRes = await storage.get(STORAGE_KEY_GOALS, false);
    state.savingsGoals = gRes ? JSON.parse(gRes.value) : [];
  }catch(e){ state.savingsGoals = []; }

  await loadSyncSettings();

  state.ready = true;
  render();

  // Cek & jalankan backup otomatis harian setiap kali app dibuka (tanpa perlu klik apapun).
  maybeAutoBackup();

  // Kalau sinkron cloud sudah diaktifkan (URL Worker terisi), langsung mulai
  // auto-sync: cek pembaruan dari perangkat lain sekarang + berkala selama app terbuka.
  if(cloudReady()) startCloudAutoSync();
}

function accountByCode(kode){ return state.coa.find(a=>a.kode===kode); }

// Menelusuri kode akun induk paling atas (root) dari sebuah akun.
// Dipakai agar mutasi di akun cabang (mis. 1011 Kas Kecil) ikut dihitung
// sebagai bagian dari akun utamanya (101 Kas).
function accountRoot(kode){
  let acc = accountByCode(kode);
  let rootKode = kode;
  let guard = 0;
  while(acc && acc.induk && guard++ < 20){
    rootKode = acc.induk;
    acc = accountByCode(acc.induk);
  }
  return rootKode;
}
function isAccountInGroup(kode, rootKode){
  return accountRoot(kode) === rootKode;
}

// Cek apakah sebuah akun adalah Kas (101) atau cabang/sub-akun dari Kas
// (mis. 1011 Kas Kecil, 1012 Kas BCA yang induknya diarahkan ke 101),
// sehingga mutasinya ikut dihitung sebagai kas di saldo & laporan.
function isKasAccount(kode){
  return isAccountInGroup(kode, '101');
}

// Menyusun daftar COA berjenjang: akun utama diikuti oleh cabang-cabangnya,
// dipakai untuk menampilkan tabel Bagan Akun dengan indentasi.
function coaHierarchy(){
  const result = [];
  const roots = state.coa.filter(a=>!a.induk || !accountByCode(a.induk));
  function addWithChildren(acc, depth){
    result.push({acc, depth});
    state.coa.filter(c=>c.induk===acc.kode).forEach(c=>addWithChildren(c, depth+1));
  }
  roots.forEach(r=>addWithChildren(r, 0));
  return result;
}

// Saldo tiap akun Aset dihitung dari saldo awal akun tsb (jika diisi) ditambah
// seluruh mutasi akun itu sendiri maupun cabang-cabangnya (mis. Kas Kecil di bawah Kas).
function openingBoundFor(rootKode){
  const o = state.openingBalances[rootKode];
  return o && o.tanggal ? new Date(o.tanggal+'T00:00:00') : null;
}

// Saldo sebuah akun (dan cabang-cabangnya) pada suatu titik waktu.
// asOf kosong = saldo saat ini. asOf diisi = saldo sebelum tanggal tsb (untuk laporan bulanan).
function accountBalance(rootKode, asOf){
  const bound = openingBoundFor(rootKode);
  const o = state.openingBalances[rootKode];
  let bal = 0;
  if(bound && (!asOf || bound < asOf)) bal += Number(o.jumlah) || 0;
  state.journal.forEach(e=>{
    const d = new Date(e.tanggal+'T00:00:00');
    if(bound && d < bound) return;
    if(asOf && d >= asOf) return;
    if(isAccountInGroup(e.debit, rootKode)) bal += Number(e.jumlah);
    if(isAccountInGroup(e.kredit, rootKode)) bal -= Number(e.jumlah);
  });
  return bal;
}

function saldoAwalKasSebelum(tanggalBatas){ return accountBalance('101', tanggalBatas); }
function kasBalance(){ return accountBalance('101'); }

// Satu entri jurnal selalu punya satu akun debit & satu akun kredit dengan
// jumlah yang sama, jadi setiap entri valid otomatis balance (debit = kredit).
// Fungsi ini menandai entri yang datanya cacat (mis. dari impor Excel yang keliru).
function isEntryValid(e){
  return !!(accountByCode(e.debit) && accountByCode(e.kredit) && e.debit !== e.kredit && Number(e.jumlah) > 0);
}

function journalStatus(){
  let totalDebit = 0, totalKredit = 0, invalid = 0;
  state.journal.forEach(e=>{
    if(isEntryValid(e)){
      totalDebit += Number(e.jumlah);
      totalKredit += Number(e.jumlah);
    } else {
      invalid++;
    }
  });
  return {totalDebit, totalKredit, invalid, balanced: invalid === 0};
}

  const headerHtml = state.tab === 'beranda' ? renderHomeHeader() : renderPageHeader();

  app.innerHTML = `

    <div class="screen" id="tabcontent"></div>
    ${renderBottomNav()}
    ${renderFooter()}

function computeInsights(){
  const insights = [];
  if(state.journal.length === 0){
    insights.push({icon:'ℹ️', text:'Belum ada transaksi tercatat. Mulai catat transaksi di tab Jurnal untuk melihat insight otomatis di sini.'});
    return insights;
  }

  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const thisStart = new Date(y, m, 1), thisEnd = new Date(y, m+1, 1);
  const prevMonth = m===0 ? 11 : m-1, prevYear = m===0 ? y-1 : y;
  const prevStart = new Date(prevYear, prevMonth, 1), prevEnd = new Date(prevYear, prevMonth+1, 1);

  function totalByTipe(tipe, field, start, end){
    let total = 0;
    state.journal.forEach(e=>{
      const d = new Date(e.tanggal+'T00:00:00');
      if(d < start || d >= end) return;
      const acc = accountByCode(e[field]);
      if(acc && acc.tipe === tipe) total += Number(e.jumlah);
    });
    return total;
  }

  const bebanBulanIni = totalByTipe('Beban', 'debit', thisStart, thisEnd);
  const bebanBulanLalu = totalByTipe('Beban', 'debit', prevStart, prevEnd);
  const pendapatanBulanIni = totalByTipe('Pendapatan', 'kredit', thisStart, thisEnd);

  if(bebanBulanLalu > 0){
    const pct = (bebanBulanIni - bebanBulanLalu) / bebanBulanLalu * 100;
    if(Math.abs(pct) >= 1){
      insights.push({
        icon: pct > 0 ? '📈' : '📉',
        text: `Pengeluaran bulan ini ${pct > 0 ? 'naik' : 'turun'} ${Math.abs(pct).toFixed(0)}% dibanding bulan lalu (${rupiah(bebanBulanIni)} vs ${rupiah(bebanBulanLalu)}).`
      });
    }
  } else if(bebanBulanIni > 0){
    insights.push({icon:'📊', text:`Pengeluaran bulan ini tercatat ${rupiah(bebanBulanIni)}. Belum ada data bulan lalu untuk dibandingkan.`});
  }

  if(pendapatanBulanIni > 0){
    if(bebanBulanIni > pendapatanBulanIni){
      insights.push({icon:'⚠️', text:`Pengeluaran bulan ini (${rupiah(bebanBulanIni)}) melebihi pemasukan (${rupiah(pendapatanBulanIni)}). Perlu ditinjau agar saldo tidak tergerus.`});
    } else {
      const rasio = (bebanBulanIni / pendapatanBulanIni * 100).toFixed(0);
      insights.push({icon:'✅', text:`Pengeluaran bulan ini masih ${rasio}% dari pemasukan. Sisa dana yang bisa ditabung sekitar ${rupiah(pendapatanBulanIni - bebanBulanIni)}.`});
    }
  }

  const bebanPerKategori = {};
  state.journal.forEach(e=>{
    const d = new Date(e.tanggal+'T00:00:00');
    if(d < thisStart || d >= thisEnd) return;
    const acc = accountByCode(e.debit);
    if(acc && acc.tipe === 'Beban') bebanPerKategori[acc.nama] = (bebanPerKategori[acc.nama]||0) + Number(e.jumlah);
  });
  const topKategori = Object.entries(bebanPerKategori).sort((a,b)=>b[1]-a[1])[0];
  if(topKategori){
    insights.push({icon:'🏷️', text:`Kategori pengeluaran terbesar bulan ini: ${topKategori[0]} (${rupiah(topKategori[1])}).`});
  }

  // Peringatan anggaran: bandingkan pemakaian tiap kategori Beban bulan ini terhadap batas di tab Anggaran.
  Object.keys(state.budgets).forEach(kode=>{
    const limit = Number(state.budgets[kode]) || 0;
    if(limit <= 0) return;
    const used = bebanPerKategori[accountByCode(kode) ? accountByCode(kode).nama : kode] || 0;
    if(used >= limit){
      const acc = accountByCode(kode);
      insights.push({icon:'🚨', text:`Anggaran "${acc ? acc.nama : kode}" sudah terlampaui: ${rupiah(used)} dari batas ${rupiah(limit)}.`});
    } else if(used >= limit * 0.8){
      const acc = accountByCode(kode);
      insights.push({icon:'⏳', text:`Anggaran "${acc ? acc.nama : kode}" sudah terpakai ${Math.round(used/limit*100)}% dari batas bulanan.`});
    }
  });

  if(insights.length === 0){
    insights.push({icon:'ℹ️', text:'Belum cukup transaksi bulan ini untuk menghasilkan insight. Catat beberapa transaksi lagi.'});
  }
  return insights;
}

// Tren pemasukan vs pengeluaran N bulan terakhir (termasuk bulan berjalan), untuk grafik di Dasbor.
function monthlyTrend(monthsBack){
  const now = new Date();
  const data = [];
  for(let i = monthsBack - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    let pendapatan = 0, beban = 0;
    state.journal.forEach(e=>{
      const ed = new Date(e.tanggal + 'T00:00:00');
      if(ed < start || ed >= end) return;
      const dAcc = accountByCode(e.debit), kAcc = accountByCode(e.kredit);
      if(kAcc && kAcc.tipe === 'Pendapatan') pendapatan += Number(e.jumlah);
      if(dAcc && dAcc.tipe === 'Beban') beban += Number(e.jumlah);
    });
    data.push({label: monthNames[d.getMonth()].slice(0,3) + ' ' + String(d.getFullYear()).slice(2), pendapatan, beban});
  }
  return data;
}

function grup503020(){
  const now = new Date();
  const thisStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisEnd = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const totals = {'Kebutuhan Pokok':0, 'Keinginan':0, 'Tabungan':0, 'Lainnya':0};
  let grandTotal = 0;
  state.journal.forEach(e=>{
    const d = new Date(e.tanggal+'T00:00:00');
    if(d < thisStart || d >= thisEnd) return;
    const acc = accountByCode(e.debit);
    if(!acc || acc.tipe !== 'Beban') return;
    const key = acc.grup && totals.hasOwnProperty(acc.grup) ? acc.grup : 'Lainnya';
    totals[key] += Number(e.jumlah);
    grandTotal += Number(e.jumlah);
  });
  return { totals, grandTotal };
}

// ---------- Terbilang: ubah angka jadi kata (bahasa Indonesia), dipakai di sub-judul Saldo Kas ----------
const TERBILANG_SATUAN = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
function terbilangBelasan(n){
  if(n < 12) return TERBILANG_SATUAN[n];
  if(n < 20) return TERBILANG_SATUAN[n-10] + ' belas';
  if(n < 100) return (TERBILANG_SATUAN[Math.floor(n/10)] || '') + ' puluh' + (n%10 ? ' ' + TERBILANG_SATUAN[n%10] : '');
  if(n < 200) return 'seratus' + (n%100 ? ' ' + terbilangBelasan(n%100) : '');
  if(n < 1000) return TERBILANG_SATUAN[Math.floor(n/100)] + ' ratus' + (n%100 ? ' ' + terbilangBelasan(n%100) : '');
  return '';
}
function terbilang(n){
  n = Math.round(Math.abs(Number(n) || 0));
  if(n === 0) return 'nol rupiah';
  function chunk(num, satuan){
    if(num === 0) return '';
    if(satuan === 'ribu' && num === 1) return 'seribu ';
    return terbilangGrup(num) + ' ' + satuan + ' ';
  }
  function terbilangGrup(num){
    if(num < 1000) return terbilangBelasan(num);
    return terbilangGrup(Math.floor(num/1000)) + ' ribu' + (num%1000 ? ' ' + terbilangBelasan(num%1000) : '');
  }
  const miliar = Math.floor(n / 1000000000);
  const juta = Math.floor((n % 1000000000) / 1000000);
  const ribu = Math.floor((n % 1000000) / 1000);
  const sisa = n % 1000;
  let hasil = '';
  hasil += chunk(miliar, 'miliar');
  hasil += chunk(juta, 'juta');
  hasil += chunk(ribu, 'ribu');
  if(sisa) hasil += terbilangBelasan(sisa) + ' ';
  return (hasil.trim() + ' rupiah').replace(/\s+/g,' ');
}

function bulanIniRange(){
  const now = new Date();
  return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date(now.getFullYear(), now.getMonth()+1, 1), label: monthNames[now.getMonth()] + ' ' + now.getFullYear() };
}

function totalBulanIni(){
  const { start, end } = bulanIniRange();
  let masuk = 0, keluar = 0;
  state.journal.forEach(e=>{
    const d = new Date(e.tanggal+'T00:00:00');
    if(d < start || d >= end) return;
    const dAcc = accountByCode(e.debit), kAcc = accountByCode(e.kredit);
    if(kAcc && kAcc.tipe === 'Pendapatan') masuk += Number(e.jumlah);
    if(dAcc && dAcc.tipe === 'Beban') keluar += Number(e.jumlah);
  });
  return { masuk, keluar, selisih: masuk - keluar };
}

// Klasifikasi sederhana masuk/keluar untuk daftar "Transaksi Terkini" di Beranda
// & Riwayat — entri yang tidak cocok pola pemasukan/pengeluaran sederhana
// (mis. transfer antar akun, penyesuaian saldo) tetap ditampilkan netral.
function klasifikasiEntri(e){
  const dAcc = accountByCode(e.debit), kAcc = accountByCode(e.kredit);
  if(kAcc && kAcc.tipe === 'Pendapatan') return { jenis:'masuk', kategori: kAcc.nama };
  if(dAcc && dAcc.tipe === 'Beban') return { jenis:'keluar', kategori: dAcc.nama };
  return { jenis:'lain', kategori: (dAcc && dAcc.nama) || e.debit };
}

const HARI_ABBR = ['MIN','SEN','SEL','RAB','KAM','JUM','SAB'];

function renderRiwayatPage(){
  const f = state.journalFilter;
  let filtered = state.journal.filter(e=>{
    if(f.q){
      const k = klasifikasiEntri(e);
      const hay = ((e.keterangan||'') + ' ' + k.kategori).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    if(f.akun && e.debit !== f.akun && e.kredit !== f.akun) return false;
    if(f.dari && e.tanggal < f.dari) return false;
    if(f.sampai && e.tanggal > f.sampai) return false;
    if(riwayatJenisFilter !== 'semua'){
      const k = klasifikasiEntri(e);
      if(k.jenis !== riwayatJenisFilter) return false;
    }
    return true;
  }).sort((a,b)=> b.tanggal.localeCompare(a.tanggal) || b.id - a.id);

  const groups = {};
  const order = [];
  filtered.forEach(e=>{
    const key = e.tanggal.slice(0,7);
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(e);
  });

  const groupsHtml = order.map(key=>{
    const [y,m] = key.split('-').map(Number);
    const entries = groups[key];
    let masuk = 0, keluar = 0;
    const rows = entries.map(e=>{
      const k = klasifikasiEntri(e);
      const d = new Date(e.tanggal+'T00:00:00');
      const jenisClass = k.jenis === 'masuk' ? 'masuk' : (k.jenis === 'keluar' ? 'keluar' : '');
      const sign = k.jenis === 'masuk' ? '+' : (k.jenis === 'keluar' ? '-' : '');
      if(k.jenis === 'masuk') masuk += Number(e.jumlah);
      if(k.jenis === 'keluar') keluar += Number(e.jumlah);
      return `
        <div class="tx-row ${jenisClass}" data-del-journal="${e.id}" title="Ketuk untuk menghapus transaksi ini" style="cursor:pointer;">
          <div class="tx-date-badge"><div class="d">${d.getDate()}</div><div class="m">${HARI_ABBR[d.getDay()]}</div></div>
          <div class="tx-mid">
            <div class="tx-name">${e.foto ? `<img src="${e.foto}" class="thumb" data-view-foto="${e.id}" alt="Foto struk" onclick="event.stopPropagation()">` : ''}${e.keterangan || k.kategori}</div>
            <div class="tx-meta">${k.kategori}${k.jenis==='lain' ? '' : (k.jenis==='masuk'?' · Pemasukan':' · Pengeluaran')}</div>
          </div>
          <div class="tx-amt">${sign}${rupiah(e.jumlah)}</div>
        </div>
      `;
    }).join('');
    return `
      <div class="tx-month-header">
        <span>${monthNames[m-1]} ${y}</span>
        <span class="totals"><span style="color:var(--sage)">${formatSaldoK(masuk)}</span><span style="color:var(--red)">${formatSaldoK(keluar)}</span></span>
      </div>
      <div class="tx-list" style="margin-bottom:16px; border-radius:0 0 var(--radius) var(--radius);">${rows}</div>
    `;
  }).join('') || `<div class="empty">Tidak ada transaksi yang cocok.</div>`;

  const akunFilterOptions = state.coa.map(a=>`<option value="${a.kode}" ${f.akun===a.kode?'selected':''}>${a.kode} — ${a.nama}</option>`).join('');
  const filterPanel = riwayatShowFilterPanel ? `
    <div class="card" id="riwayat-filter-panel" style="margin-bottom:14px;">
      <label for="rw-akun">Filter Akun</label>
      <select id="rw-akun"><option value="">Semua Akun</option>${akunFilterOptions}</select>
      <div class="row2">
        <div><label for="rw-dari">Dari Tanggal</label><input type="date" id="rw-dari" value="${f.dari}"></div>
        <div><label for="rw-sampai">Sampai Tanggal</label><input type="date" id="rw-sampai" value="${f.sampai}"></div>
      </div>
      <button type="button" class="btn btn-ghost" id="rw-reset" style="margin-top:12px;">Reset Filter</button>
    </div>
  ` : '';

  return `
    <div class="search-bar">
      ${ICON.search()}
      <input type="text" id="rw-q" placeholder="Cari transaksi atau kategori..." value="${f.q}">
    </div>
    <div class="chip-row">
      <button type="button" class="chip ${riwayatJenisFilter==='semua'?'active':''}" data-jenis-filter="semua">Semua</button>
      <button type="button" class="chip ${riwayatJenisFilter==='masuk'?'active':''}" data-jenis-filter="masuk">Pemasukan</button>
      <button type="button" class="chip ${riwayatJenisFilter==='keluar'?'active':''}" data-jenis-filter="keluar">Pengeluaran</button>
    </div>
    ${filterPanel}
    ${groupsHtml}
  `;
}
function rootAsetAccounts(){
  return state.coa.filter(a=>a.tipe==='Aset' && (!a.induk || !accountByCode(a.induk)));

function renderAsetTab(){
  const asetTetap = fixedAsetAccounts();
  const totalNilai = asetTetap.reduce((sum,a)=> sum + accountBalance(a.kode), 0);

  // Kelompokkan nilai & jumlah aset per kategori (mis. berapa banyak & berapa
  // total nilai emas, kendaraan, dst) untuk kartu "Ringkasan per Kategori".
  const perKategori = {};
  asetTetap.forEach(a=>{
    const kat = a.kategori || 'Lainnya';
    if(!perKategori[kat]) perKategori[kat] = { jumlah: 0, nilai: 0 };
    perKategori[kat].jumlah += 1;
    perKategori[kat].nilai += accountBalance(a.kode);
  });
  const kategoriRows = Object.keys(perKategori).sort((x,y)=> perKategori[y].nilai - perKategori[x].nilai).map(kat=>{
    const d = perKategori[kat];
    const icon = KATEGORI_ASET[kat] || '\ud83d\udce6';
    const pct = totalNilai > 0 ? Math.round(d.nilai / totalNilai * 100) : 0;
    return `
      <div class="breakdown-row">
        <div class="nm">${icon} ${kat} <span style="color:var(--ink-soft);">(${d.jumlah} aset)</span></div>
        <div class="bar"><div style="width:${pct}%; background:var(--gold);"></div></div>
        <div class="val">${rupiah(d.nilai)}</div>
      </div>
    `;
  }).join('') || '<p class="empty">Belum ada aset tetap tercatat.</p>';

  const daftarAset = asetTetap.map(a=>{
    const nilai = accountBalance(a.kode);
    const beli = state.openingBalances[a.kode];
    const icon = KATEGORI_ASET[a.kategori] || '\ud83d\udce6';
    return `
      <div class="opening-row">
        <div class="opening-row-label">${icon} ${a.nama} <span style="color:var(--ink-soft); font-weight:400; text-transform:none;">(${a.kategori || 'Lainnya'})</span></div>
        <div class="status-msg">
          Nilai saat ini: <strong>${rupiah(nilai)}</strong>${beli ? ` &middot; Dibeli ${fmtDate(beli.tanggal)} seharga ${rupiah(beli.jumlah)}` : ''}
        </div>
        <div class="row2" style="margin-top:8px;">
          <input type="text" inputmode="numeric" class="ribuan-input" id="av-nilai-${a.kode}" placeholder="Nilai terbaru (Rp)">
          <button type="button" class="btn btn-ghost" style="margin-top:0;" data-update-asset="${a.kode}">Perbarui Nilai</button>
        </div>
        <button type="button" class="btn-danger" style="margin-top:8px;" data-del-asset="${a.kode}">Hapus Aset Ini</button>
      </div>
    `;
  }).join('') || '<p class="empty">Belum ada aset tetap tercatat. Tambahkan lewat form di bawah.</p>';

  const sumberOptions = liquidAsetAccounts().map(x=>`<option value="${x.kode}">${x.kode} — ${x.nama}</option>`).join('');

  return `
    <div class="card">
      <h2>Total Nilai Aset Tetap</h2>
      <p class="sub">Kekayaan non-tunai seperti kendaraan, emas, atau properti. Beda dari Kas/Tabungan: nilainya bisa naik-turun dan tidak dipakai transaksi harian.</p>
      <div class="summary-grid" style="grid-template-columns:1fr;">
        <div class="stat"><div class="k">Total Aset Tetap</div><div class="v">${rupiah(totalNilai)}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Ringkasan per Kategori</h2>
      <p class="sub">Total nilai & jumlah aset dikelompokkan per kategori, mis. berapa banyak dan berapa nilai emas yang kamu punya.</p>
      ${kategoriRows}
    </div>

    <div class="card">
      <h2>Daftar Aset</h2>
      ${daftarAset}
    </div>

  let count = 0, totalBytes = 0;
  state.journal.forEach(e=>{
    if(e.foto){ count++; totalBytes += e.foto.length; }
  });
  return { count, totalKB: Math.round(totalBytes / 1024) };
}

function computeMonthlyReport(y, m){
  const monthStart = new Date(y, m, 1);
  const monthEnd = new Date(y, m+1, 1);
  const saldoAwal = saldoAwalKasSebelum(monthStart);
  const bound = openingBoundFor('101');

  const monthEntries = state.journal
    .filter(e=>{
      const d = new Date(e.tanggal+'T00:00:00');
      if(bound && d < bound) return false;
      // Transaksi antar dua akun yang sama-sama bagian dari grup Kas (mis. transfer
      // Kas Utama -> Kas Kecil) bersifat internal & netral terhadap total saldo Kas,
      // sehingga tidak boleh dihitung sebagai Kas Masuk/Keluar di laporan ini.
      if(isKasAccount(e.debit) && isKasAccount(e.kredit)) return false;
      return d >= monthStart && d < monthEnd && (isKasAccount(e.debit) || isKasAccount(e.kredit));
    })
    .sort((a,b)=> a.tanggal.localeCompare(b.tanggal) || a.id - b.id);

  let totalMasuk = 0, totalKeluar = 0;
  let running = saldoAwal;
  const rows = monthEntries.map(e=>{
    const masuk = isKasAccount(e.debit);
    const jumlah = Number(e.jumlah);
    if(masuk){ totalMasuk += jumlah; running += jumlah; } else { totalKeluar += jumlah; running -= jumlah; }
    const lawanKode = masuk ? e.kredit : e.debit;
    const lawan = accountByCode(lawanKode);
    return { tanggal: e.tanggal, keterangan: e.keterangan || (lawan ? lawan.nama : '—'), masuk, jumlah, saldoBerjalan: running };
  });

  const saldoAkhir = saldoAwal + totalMasuk - totalKeluar;

  const bebanTotals = {};
  monthEntries.forEach(e=>{
    if(isKasAccount(e.kredit)){
      const acc = accountByCode(e.debit);
      const key = acc ? acc.nama : e.debit;
      bebanTotals[key] = (bebanTotals[key]||0) + Number(e.jumlah);
    }
  });

  return { saldoAwal, totalMasuk, totalKeluar, saldoAkhir, rows, bebanTotals };
}

function renderMiniTrendChart(){
  const data = monthlyTrend(6);
  const max = Math.max(1, ...data.flatMap(d=>[d.pendapatan, d.beban]));
  const chartH = 110, barW = 13, gap = 5, groupGap = 18;
  const groupW = barW * 2 + gap;
  const totalW = data.length * (groupW + groupGap);
  const bars = data.map((d,i)=>{
    const x = i * (groupW + groupGap);
    const hP = Math.round(d.pendapatan / max * chartH);
    const hB = Math.round(d.beban / max * chartH);
    return `
      <g transform="translate(${x},0)">
        <rect x="0" y="${chartH-hP}" width="${barW}" height="${hP}" style="fill:var(--sage)" rx="3"></rect>
        <rect x="${barW+gap}" y="${chartH-hB}" width="${barW}" height="${hB}" style="fill:var(--red)" rx="3"></rect>
        <text x="${barW}" y="${chartH+14}" font-size="9" style="fill:var(--ink-soft)" text-anchor="middle" font-family="IBM Plex Mono, monospace">${d.label}</text>
      </g>
    `;
  }).join('');
  return `
    <div class="table-wrap">
    <svg width="${totalW}" height="${chartH+24}" viewBox="0 0 ${totalW} ${chartH+24}" style="min-width:${totalW}px; display:block; margin:0 auto;">
      ${bars}
    </svg>
    </div>
    <div style="display:flex; gap:16px; margin-top:8px; justify-content:center; font-size:11px; color:var(--ink-soft);">
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--sage);border-radius:2px;margin-right:4px;"></span>Pemasukan</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--red);border-radius:2px;margin-right:4px;"></span>Pengeluaran</span>
    </div>
  `;
}

function renderAnggaranPage(){
  const bebanAccounts = state.coa.filter(a=>a.tipe==='Beban' && a.kode !== '902');
  const now = new Date();
  const thisStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisEnd = new Date(now.getFullYear(), now.getMonth()+1, 1);

  function terpakaiBulanIni(kode){
    let total = 0;
    state.journal.forEach(e=>{
      const d = new Date(e.tanggal+'T00:00:00');
      if(d < thisStart || d >= thisEnd) return;
      if(e.debit === kode) total += Number(e.jumlah);
    });
    return total;
  }

  let totalAnggaran = 0, totalTerpakai = 0;
  const itemsHtml = bebanAccounts.map(a=>{
    const limit = Number(state.budgets[a.kode]) || 0;
    const used = terpakaiBulanIni(a.kode);
    if(limit > 0){ totalAnggaran += limit; totalTerpakai += used; }
    const pct = limit > 0 ? Math.round(used / limit * 100) : 0;
    const barColor = pct >= 100 ? 'var(--red)' : (pct >= 80 ? 'var(--gold)' : 'var(--sage)');
    return `

// Teks status singkat sinkron cloud, dipakai di tab Cloud & bisa dipanggil ulang
// tanpa render seluruh halaman lewat updateCloudStatusUI().
function cloudStatusText(){
  const s = state.sync || SYNC_DEFAULTS;
  if(!s.cfUrl) return 'Sinkron cloud belum diaktifkan — edisi lokal HP ini saja.';
  if(!navigator.onLine) return '&#128246; Offline — perubahan tersimpan di HP, akan terkirim otomatis begitu online lagi.';
  if(s.lastSyncError) return '&#10060; Gagal sinkron: ' + s.lastSyncError;
  if(s.dirty) return '&#8987; Ada perubahan terbaru, sedang dikirim ke cloud…';
  // Belum PERNAH push maupun pull -> jangan bilang "Tersinkron" (menyesatkan),
  // karena belum ada data yg benar-benar bertukar dgn cloud sama sekali.
  if(!s.lastPush && !s.lastPull) return '&#9203; Pengaturan tersimpan, tapi belum pernah disinkron — tekan "Sinkron Sekarang" (kalau ini HP pertama) atau "Tarik dari Cloud" (kalau sudah ada data dari HP lain).';
  return '&#9989; Tersinkron — versi cloud saat ini: v' + (s.cloudVersion ?? '?');
}
